
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171912">
<title>KAREN | الرئيسية</title>
<style>
:root {
  --bg:#171912;
  --matcha:#a3a785;
  --matcha-dark:#777d5e;
  --text:#f2f0e5;
  --muted:#b5b5a5;
  --green:#a7f5bc;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  color:var(--text);
  background:
    radial-gradient(ellipse at 50% 20%,#858b6020,transparent 60%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 7%;
  border-bottom:1px solid #ffffff12;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:2px;
  font-size:22px;
}
.logo {
  width:40px;height:40px;
  display:grid;place-items:center;
  border:1px solid var(--matcha-dark);
  background:#858b601c;
  color:var(--matcha);
  border-radius:12px;
}
.tag {
  color:var(--matcha);
  font-size:11px;
  letter-spacing:1px;
}
main {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:50px 22px;
}
.hero {
  width:100%;
  max-width:650px;
  text-align:center;
}
.eyebrow {
  display:inline-block;
  padding:9px 15px;
  border:1px solid #a3a78550;
  border-radius:30px;
  color:var(--matcha);
  font-size:12px;
}
h1 {
  margin:28px 0 14px;
  font-size:clamp(52px,12vw,88px);
  letter-spacing:3px;
  line-height:1;
}
.subtitle {
  color:var(--muted);
  line-height:2;
  font-size:14px;
}
.rights {
  color:var(--matcha);
  font-size:12px;
  margin:25px 0 32px;
  line-height:2;
}
.enter {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:88px;
  border-radius:18px;
  border:1px solid #baf9ca;
  background:linear-gradient(110deg,#168e49,#36d976,#168e49);
  background-size:200% 100%;
  color:white;
  font-size:21px;
  font-weight:900;
  box-shadow:0 0 30px #36d97630;
  animation:shine 4s linear infinite;
  text-decoration:none;
  transition:transform .2s;
}
.enter:active {transform:scale(.98);}
@keyframes shine {
  from {background-position:100% 0;}
  to {background-position:-100% 0;}
}
.enter span:last-child {font-size:26px;}
footer {
  border-top:1px solid #ffffff12;
  text-align:center;
  padding:22px 15px;
  color:var(--muted);
  font-size:11px;
  line-height:2;
}
@media(prefers-reduced-motion:reduce) {
  .enter {animation:none;}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">K</span>
    <span>KAREN</span>
  </div>
  <span class="tag">OFFICIAL</span>
</header>

<main>
  <section class="hero">
    <span class="eyebrow">KAREN OFFICIAL WEBSITE</span>
    <h1>KAREN</h1>
    <p class="subtitle">
      مرحباً بك في الموقع الرسمي لكارين.
      <br>
      كل شيء تحتاجه يبدأ من هنا.
    </p>

    <p class="rights">
      © KAREN — ALL RIGHTS RESERVED
      <br>
      جميع الحقوق محفوظة
    </p>

    <a class="enter" href="download.html">
      <span>DELTA IPHONE</span>
      <span>↗</span>
    </a>
  </section>
</main>

<footer>
  KAREN OFFICIAL · جميع الحقوق محفوظة
  <br>
  <a href="https://discord.gg/BzpFr7vFa"
     style="color:inherit;text-decoration:none">
    KAREN DISCORD
  </a>
</footer>
</body>
</html>
